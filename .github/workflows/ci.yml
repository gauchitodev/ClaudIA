name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    # A test that hangs instead of failing would hold the job until GitHub's own limit, six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # 30 s a test instead of npm test's 120, which are for the tablet: at 120 s each, a broken fake that hung a
      # handful of tests ran out the 15 minutes, and GitHub cut the job without saying which ones. On Node 22 they're a
      # file's, all its tests together: a file whose tests add up to more fails there, with none of them hung. And 10
      # minutes for the whole run: on Node 24 and 26, a test file that leaves something going (a timer, an interval)
      # keeps node --test waiting for it forever, past --test-timeout, which there is per test. Stopped by timeout, they
      # say which file they were waiting for. On Node 22 that file fails by name when its 30 s run out.
      - run: timeout 600 npm run test:ci
