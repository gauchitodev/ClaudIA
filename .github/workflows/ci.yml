name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    # A test that hangs instead of failing would hold the job until GitHub's own limit, six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # 30 s a test instead of npm test's 120, which are for the tablet: at 120 s each, a broken fake that hung a
      # handful of tests ran out the 15 minutes, and GitHub cut the job without saying which ones.
      - run: npm run test:ci
