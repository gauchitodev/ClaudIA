# Copiá este archivo como config.toml y completá los valores.
# config.toml está en .gitignore: nunca se sube al repo.

# Número del bot sin "+" ni espacios ni guiones. Dejar vacío para vincular con código QR.
numberBot = ""

# Números de owners del bot sin "+" ni espacios ni guiones.
owners = [""]

# API key de Gemini. Sin esto no hay charla con IA (.ia, .gemini y las respuestas automáticas).
geminiApiKey = ""

# API key de Groq. Primer respaldo cuando Gemini falla o se queda sin cuota. Opcional.
groqApiKey = ""

# API key de OpenRouter. Segundo respaldo de IA; usa solo modelos gratis. Opcional.
openrouterApiKey = ""

# API key de NVIDIA NIM. Tercer respaldo de IA. Opcional.
nvidiaApiKey = ""

# API key de Tenor (Google). Solo la usa .emojimix. Opcional.
tenorApiKey = ""

# API key de Cerebras. Último respaldo de IA; sin saldo cargado no responde. Opcional.
cerebrasApiKey = ""

# Texto con el que responde .faggi. Opcional. Para varias líneas usá comillas triples: textofaggi = """..."""
textofaggi = ""

# Tarjeta con link que acompaña a los archivos que manda el bot (audio, video, imagen).
# Tiene que ir al final del archivo, después de las claves sueltas. Sin "enlace" no se manda tarjeta.

[gemini]
# Modelos de Gemini a usar, en orden (si uno falla o se queda sin cuota, prueba el siguiente). Vacío = los de
# siempre (3.6 Flash, 3.5 Flash, 3.5 Flash Lite). Con una clave paga conviene el más barato primero, por ejemplo:
# modelos = ["gemini-3.5-flash-lite", "gemini-3.5-flash"]
modelos = []

[tarjetaGrupo]
titulo = "ClaudIA :)"
cuerpo = "Unite al grupo"
enlace = ""

# Canal de WhatsApp para la etiqueta "reenviado desde el canal" en los archivos del bot.
# El bot obtiene el ID del canal solo, a partir del link, al conectarse. "nombre" es opcional: si no está, usa el real.
[canal]
enlace = ""
nombre = ""

# Voz de Claudia para las notas de voz (.voz) y para .tts: una voz de edge-tts (pip install edge-tts; la lista sale con
# edge-tts --list-voices), con su velocidad y su tono. Opcional: sin esta sección usa es-AR-ElenaNeural, +0% y +0Hz.
[voz]
voz = "es-AR-ElenaNeural"
velocidad = "+0%"
tono = "+0Hz"
